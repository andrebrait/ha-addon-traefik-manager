# Opens a pull request when Traefik Manager publishes a release newer than the add-on's version.
name: Follow Traefik Manager releases

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo chr0nzz/traefik-manager --json tagName -q .tagName)
          latest=${latest#v}
          current=$(sed -n 's/^version: "\(.*\)"$/\1/p' traefik_manager/config.yaml)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          if [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then echo "newer=true" >> "$GITHUB_OUTPUT"; fi

      - name: Update the add-on
        if: steps.v.outputs.newer == 'true'
        env:
          NEW: ${{ steps.v.outputs.latest }}
          OLD: ${{ steps.v.outputs.current }}
        run: |
          sed -i "s/^version: \".*\"$/version: \"$NEW\"/" traefik_manager/config.yaml
          sed -i "s|ghcr.io/chr0nzz/traefik-manager:$OLD|ghcr.io/chr0nzz/traefik-manager:$NEW|" traefik_manager/build.yaml
          printf '# Changelog\n\n## %s\n\n- Traefik Manager %s: https://github.com/chr0nzz/traefik-manager/releases/tag/v%s\n' "$NEW" "$NEW" "$NEW" > new.md
          tail -n +2 traefik_manager/CHANGELOG.md >> new.md && mv new.md traefik_manager/CHANGELOG.md

      - name: Open the pull request
        if: steps.v.outputs.newer == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/traefik-manager-${{ steps.v.outputs.latest }}
          title: Traefik Manager ${{ steps.v.outputs.latest }}
          commit-message: Traefik Manager ${{ steps.v.outputs.latest }}
          body: |
            Traefik Manager [${{ steps.v.outputs.latest }}](https://github.com/chr0nzz/traefik-manager/releases/tag/v${{ steps.v.outputs.latest }}).
            Check its release notes for changed settings before merging.
