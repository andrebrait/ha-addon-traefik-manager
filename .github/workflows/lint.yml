name: Lint

on:
  push:
  pull_request:

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./traefik_manager

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image (amd64)
        run: |
          from=$(sed -n 's/^  amd64: //p' traefik_manager/build.yaml)
          docker build --build-arg BUILD_FROM="$from" -t addon-test traefik_manager
